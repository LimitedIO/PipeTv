name: Release APK

# Every push to main builds a signed APK and publishes it as a GitHub Release.
# The app's built-in updater picks it up automatically.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew assembleRelease -Pvcode=${{ github.run_number }} -Pvname=1.0.${{ github.run_number }}
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PipeTv-1.0.${{ github.run_number }}.apk
          gh release create v1.0.${{ github.run_number }} PipeTv-*.apk \
            --title "PipeTv 1.0.${{ github.run_number }}" --generate-notes
