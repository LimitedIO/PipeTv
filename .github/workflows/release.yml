name: Release APK

# Every push to main builds a signed APK and publishes it as a GitHub Release.
# The app's built-in updater picks it up automatically.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".github/assets/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        # Offset past the pre-existing v1.0.1..v1.0.22 tags so tags and versionCodes stay unique and increasing
        run: echo "V=$(( ${{ github.run_number }} + 22 ))" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew assembleRelease -Pvcode=$V -Pvname=1.0.$V
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk PipeTv-1.0.$V.apk
          gh release create v1.0.$V PipeTv-*.apk \
            --title "PipeTv 1.0.$V" --generate-notes
